name: Production dependency audit

on:
  push:
    branches:
      - chore/career-production-deps-audit-20261118
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/career-prod-deps-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit only runtime dependencies
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/career-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('/tmp/career-audit.json', 'utf8'));
          const issues = Object.entries(doc.vulnerabilities || {}).map(([name,v])=>({
            package:name,severity:v.severity,isDirect:v.isDirect,
            advisory:(v.via||[]).filter(x=>typeof x==="object").map(x=>x.title).slice(0,3),
            fixAvailable:v.fixAvailable
          }));
          console.log('Production dependency audit:',JSON.stringify(doc.metadata?.vulnerabilities||{}));
          console.log('Affected packages:',JSON.stringify(issues));
          if((doc.metadata?.vulnerabilities?.high||0)+(doc.metadata?.vulnerabilities?.critical||0)>0)
            process.exitCode=1;
          NODE
          if [ "$status" -ne 0 ]; then echo "npm audit identified advisory findings"; fi
