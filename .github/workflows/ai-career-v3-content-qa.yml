name: AI Career v3 content quality

on:
  push:
    branches:
      - feature/ai-career-v3-sales-role-matrix-20261118
  pull_request:
    paths:
      - "content/career/v3/**"
      - "docs/products/ai-career-v3/**"
      - "tests/ai-career-v3-*.test.mjs"
      - "scripts/career/validate-v3-*.mjs"
      - "scripts/career/build-safety-materials.mjs"
      - "scripts/career/build-sales-lesson-materials.mjs"
      - "lib/career-v3/**"
      - "lib/server/career-v3/**"
      - ".github/workflows/ai-career-v3-content-qa.yml"

permissions:
  contents: read

jobs:
  role-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main for the schema comparison test
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Validate sales role matrix and constraints
        run: node --test tests/ai-career-v3-role-sales.test.mjs
      - name: Validate lessons, safety module, sources and downloadable files
        run: |
          node scripts/career/validate-v3-content.mjs
          node --test tests/ai-career-v3-safety-module.test.mjs
      - name: Validate practical sales lessons (SAL-02, SAL-05)
        run: |
          node scripts/career/validate-v3-sales-lessons.mjs
          node scripts/career/build-sales-lesson-materials.mjs --check
      - name: Validate v3 engine (library, diagnostic, readiness)
        run: node --test --experimental-strip-types tests/ai-career-v3-engine.test.mjs
      - name: Run full app and synthetic career regression tests
        run: npm test
      - name: Check TypeScript and ESLint
        run: |
          npm run typecheck
          npm run lint
      - name: Confirm production Next.js build stays intact
        run: npm run build
